name: WebDriver Tests

on:
  push:
    paths:
      - 'Framework/Atom.Net.Browsing.WebDriver/**'
      - 'Tests/Atom.Net.Browsing.WebDriver.Tests/**'
      - 'Tests/Atom.Net.Browsing.Tests/**'
      - '.github/workflows/webdriver-tests.yml'
      - 'global.json'
      - 'Framework/Directory.Build.props'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'NuGet.config'
  # Без path-фильтра: обязательные проверки ruleset должны приходить на ЛЮБОЙ PR в master,
  # иначе PR без WebDriver-изменений зависнет в состоянии Expected.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webdriver-nunit-tests:
    name: NUnit (Atom.Net.Browsing.WebDriver.Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Prepare local NuGet feed directories
        # NuGet.config указывает локальный фид .tmp/local-nuget-feed, который игнорируется
        # git и отсутствует в чистом checkout; TreatWarningsAsErrors превращает NU1301
        # (missing local source) в ошибку restore. Пустые каталоги устраняют проблему.
        run: mkdir -p .tmp/local-nuget-feed .tmp/nuget-packages

      - name: Restore WebDriver test suite
        run: dotnet restore Tests/Atom.Net.Browsing.WebDriver.Tests/Atom.Net.Browsing.WebDriver.Tests.csproj

      - name: Run WebDriver NUnit suite
        run: >-
          dotnet test --project Tests/Atom.Net.Browsing.WebDriver.Tests/Atom.Net.Browsing.WebDriver.Tests.csproj
          --verbosity minimal
          -p:RunAnalyzers=false
          -p:EnforceCodeStyleInBuild=false
          -p:EnableNETAnalyzers=false
          -p:AnalysisMode=None

  extension-runtime-tests:
    name: Node (ExtensionRuntime typecheck + tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Framework/Atom.Net.Browsing.WebDriver/ExtensionRuntime/package-lock.json

      - name: Install ExtensionRuntime dependencies
        working-directory: Framework/Atom.Net.Browsing.WebDriver/ExtensionRuntime
        run: npm ci

      - name: Typecheck ExtensionRuntime
        working-directory: Framework/Atom.Net.Browsing.WebDriver/ExtensionRuntime
        run: npm run typecheck

      - name: Run ExtensionRuntime tests
        working-directory: Framework/Atom.Net.Browsing.WebDriver/ExtensionRuntime
        run: npm test
