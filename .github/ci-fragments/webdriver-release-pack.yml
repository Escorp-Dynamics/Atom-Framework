# Это фрагмент workflow, а не самостоятельный workflow-файл.
#
# Он лежит вне .github/workflows/, потому что на текущем App token
# нет permission "workflows": любое изменение внутри .github/workflows/
# отклоняется при push. Чтобы активировать джобу, перенеси блок
# `webdriver-release-pack` ниже в раздел `jobs:` файла
# .github/workflows/webdriver-tests.yml (шаги "Prepare local NuGet feed
# directories" из существующих workflow при этом можно удалить: каталог
# .tmp/local-nuget-feed теперь закоммичен и mkdir больше не нужен).
#
# Назначение: подтвердить, что свежий клон репозитория проходит полный
# Release-путь: restore цепочки Escorp.Atom.* через локальный фид,
# Release-сборка, dotnet pack и контроль состава пакета (иконка,
# contentFiles расширений Chromium и Firefox).

webdriver-release-pack:
  name: Pack (Escorp.Atom.Net.Browsing.WebDriver, Release)
  runs-on: ubuntu-latest

  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: Framework/Atom.Net.Browsing.WebDriver/ExtensionRuntime/package-lock.json

    - name: Pack framework dependency chain into local NuGet feed
      # Release-конфигурация вебдрайвера ссылается на Escorp.Atom.* плавающей версией "*",
      # а часть цепочки (напр., Escorp.Atom.Media.Audio) не опубликована на nuget.org:
      # без local feed свежий клон не пройдёт restore. Этот шаг воспроизводит ровно тот
      # путь, по которому проходит пользователь после клонирования.
      run: bash .vscode/scripts/pack-webdriver-local-dependencies.sh

    - name: Build and pack WebDriver (Release)
      run: >-
        dotnet pack Framework/Atom.Net.Browsing.WebDriver/Atom.Net.Browsing.WebDriver.csproj
        -c Release --nologo
        --output .tmp/webdriver-pack-check

    - name: Verify produced package layout
      run: |
        set -euo pipefail
        nupkg="$(find .tmp/webdriver-pack-check -maxdepth 1 -type f -name '*.nupkg' | head -n 1)"
        test -n "$nupkg" || { echo "WebDriver nupkg not produced"; exit 1; }
        echo "Produced package: $nupkg"
        unzip -l "$nupkg"
        unzip -l "$nupkg" | grep -q 'icon.png' \
          || { echo "icon.png missing from package"; exit 1; }
        unzip -l "$nupkg" | grep -q 'contentFiles/any/any/Extension/content.js' \
          || { echo "Chromium Extension contentFiles missing from package"; exit 1; }
        unzip -l "$nupkg" | grep -q 'contentFiles/any/any/Extension.Firefox/content.js' \
          || { echo "Firefox Extension contentFiles missing from package"; exit 1; }
